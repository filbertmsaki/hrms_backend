name: Test HRMS UAT Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runner:
    name: Test UAT Deployment Runner
    runs-on:
      - self-hosted
      - Linux
      - X64
      - hrms
      - backend
      - deployment

    environment:
      name: hrms-backend-uat

    timeout-minutes: 10

    env:
      BASE_DIR: ${{ vars.BASE_DIR }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      APP_ENV: ${{ vars.APP_ENV }}
      APP_HOST: ${{ vars.APP_HOST }}
      APP_PORT: ${{ vars.APP_PORT }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH }}

    steps:
      - name: Verify deployment user
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "User:"
          whoami

          echo
          echo "Identity:"
          id

          if [[ "$(whoami)" != "hrms-deploy" ]]; then
            echo "ERROR: Runner must run as hrms-deploy"
            exit 1
          fi

          if id -nG | tr ' ' '\n' | grep -qxE 'sudo|wheel'; then
            echo "ERROR: hrms-deploy must not belong to sudo/wheel"
            exit 1
          fi

          echo
          echo "Deployment user: OK"

      - name: Verify required tools
        shell: bash
        run: |
          set -Eeuo pipefail

          for command in \
            node \
            npm \
            pm2 \
            git \
            curl \
            psql \
            redis-cli \
            tar \
            gzip \
            flock \
            python3
          do
            if ! command -v "$command" >/dev/null 2>&1; then
              echo "ERROR: Missing command: $command"
              exit 1
            fi

            echo "OK: $command"
          done

          echo
          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "PM2:"
          pm2 --version

          echo "PostgreSQL client:"
          psql --version

      - name: Verify GitHub environment variables
        shell: bash
        run: |
          set -Eeuo pipefail

          for name in \
            BASE_DIR \
            PM2_APP_NAME \
            APP_ENV \
            APP_HOST \
            APP_PORT \
            HEALTH_PATH
          do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: Missing GitHub Environment variable: $name"
              exit 1
            fi
          done

          echo "BASE_DIR=$BASE_DIR"
          echo "PM2_APP_NAME=$PM2_APP_NAME"
          echo "APP_ENV=$APP_ENV"
          echo "APP_HOST=$APP_HOST"
          echo "APP_PORT=$APP_PORT"
          echo "HEALTH_PATH=$HEALTH_PATH"

      - name: Verify UAT directory permissions
        shell: bash
        run: |
          set -Eeuo pipefail

          for directory in \
            "$BASE_DIR" \
            "$BASE_DIR/releases" \
            "$BASE_DIR/shared" \
            "$BASE_DIR/shared/logs" \
            "$BASE_DIR/shared/storage/public" \
            "$BASE_DIR/shared/storage/private" \
            "$BASE_DIR/shared/backups/database" \
            "$BASE_DIR/tmp"
          do
            if [[ ! -d "$directory" ]]; then
              echo "ERROR: Directory missing: $directory"
              exit 1
            fi

            if [[ ! -w "$directory" ]]; then
              echo "ERROR: Directory not writable: $directory"
              exit 1
            fi

            echo "OK: $directory"
          done

      - name: Verify UAT environment file
        shell: bash
        run: |
          set -Eeuo pipefail

          ENV_FILE="$BASE_DIR/shared/.env"

          if [[ ! -f "$ENV_FILE" ]]; then
            echo "ERROR: .env file missing"
            exit 1
          fi

          OWNER="$(stat -c '%U' "$ENV_FILE")"
          GROUP="$(stat -c '%G' "$ENV_FILE")"
          MODE="$(stat -c '%a' "$ENV_FILE")"

          echo "Owner: $OWNER:$GROUP"
          echo "Permissions: $MODE"

          [[ "$OWNER" == "hrms-deploy" ]]
          [[ "$MODE" == "600" ]]

          echo
          echo "Safe UAT settings:"

          grep -E \
            '^(NODE_ENV|APP_ENV|APP_HOST|APP_PORT|APP_GLOBAL_PREFIX|DB_HOST|DB_PORT|DB_USERNAME|DB_NAME|USE_REDIS|REDIS_URL|REDIS_NOTIFICATION_CHANNEL|APP_PUBLIC_STORAGE_PATH|APP_PRIVATE_STORAGE_PATH|DB_BACKUP_DIR|HEALTH_DISK_PATH|RUN_SEEDER_ON_STARTUP)=' \
            "$ENV_FILE"

          echo
          echo ".env: OK"

      - name: Verify UAT PostgreSQL connection
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - "$BASE_DIR/shared/.env" <<'PY'
          import os
          import subprocess
          import sys

          env_file = sys.argv[1]

          required = {
              "DB_HOST",
              "DB_PORT",
              "DB_USERNAME",
              "DB_PASSWORD",
              "DB_NAME",
          }

          values = {}

          with open(env_file, encoding="utf-8") as f:
              for raw in f:
                  line = raw.strip()

                  if not line or line.startswith("#") or "=" not in line:
                      continue

                  key, value = line.split("=", 1)

                  if key not in required:
                      continue

                  value = value.strip()

                  if (
                      len(value) >= 2
                      and value[0] == value[-1]
                      and value[0] in ("'", '"')
                  ):
                      value = value[1:-1]

                  values[key] = value

          missing = required - values.keys()

          if missing:
              raise SystemExit(
                  "Missing DB settings: " + ", ".join(sorted(missing))
              )

          env = os.environ.copy()
          env["PGPASSWORD"] = values["DB_PASSWORD"]

          subprocess.run(
              [
                  "psql",
                  "-h", values["DB_HOST"],
                  "-p", values["DB_PORT"],
                  "-U", values["DB_USERNAME"],
                  "-d", values["DB_NAME"],
                  "-Atc", "SELECT 1;",
              ],
              env=env,
              check=True,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )

          print("PostgreSQL connection: OK")
          PY

      - name: Verify UAT Redis
        shell: bash
        run: |
          set -Eeuo pipefail

          RESULT="$(
            redis-cli \
              -h 127.0.0.1 \
              -p 6379 \
              -n 1 \
              PING
          )"

          if [[ "$RESULT" != "PONG" ]]; then
            echo "ERROR: Redis UAT database unavailable"
            exit 1
          fi

          echo "Redis DB 1: PONG"

          echo
          echo "Redis UAT keys:"
          redis-cli \
            -h 127.0.0.1 \
            -p 6379 \
            -n 1 \
            DBSIZE

      - name: Verify PM2 access
        shell: bash
        run: |
          set -Eeuo pipefail

          pm2 ls

          if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
            echo
            echo "$PM2_APP_NAME already exists."

            pm2 status "$PM2_APP_NAME"
          else
            echo
            echo "$PM2_APP_NAME has not been deployed yet."
            echo "This is expected before the first UAT deployment."
          fi

      - name: Verify current UAT deployment state
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -L "$BASE_DIR/current" ]]; then
            echo "Current release:"
            readlink -f "$BASE_DIR/current"
          else
            echo "No current release yet."
            echo "This is expected before the first deployment."
          fi

          echo

          if ss -lnt | grep -q ":${APP_PORT} "; then
            echo "Port $APP_PORT currently has a listener."
          else
            echo "Port $APP_PORT is currently free."
          fi

      - name: Preflight complete
        run: |
          echo "======================================"
          echo "HRMS UAT RUNNER TEST PASSED"
          echo "======================================"
