name: Cleanup Workflow Runs

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - HRMS Backend CI/CD
      - HRMS Backend Deployment Preflight
      - HRMS Backend Rollback
      - Test HRMS UAT Runner
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-workflow-runs
  cancel-in-progress: false

jobs:
  cleanup:
    name: Keep recent runs only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      KEEP_LATEST_RUNS: 20
      KEEP_FAILED_RUNS: 2
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Delete old and failed workflow runs
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t runs < <(
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .conclusion, .name] | @tsv'
          )

          failed_seen=0

          for index in "${!runs[@]}"; do
            IFS=$'\t' read -r run_id conclusion workflow_name <<< "${runs[$index]}"

            if [[ "$run_id" == "$CURRENT_RUN_ID" ]]; then
              continue
            fi

            delete_run=false

            if (( index >= KEEP_LATEST_RUNS )); then
              delete_run=true
            fi

            if [[ "$conclusion" == "failure" ]]; then
              if (( failed_seen >= KEEP_FAILED_RUNS )); then
                delete_run=true
              fi
              ((failed_seen += 1))
            fi

            if [[ "$delete_run" == true ]]; then
              echo "Deleting workflow run ${run_id} (${workflow_name:-unknown}, conclusion: ${conclusion:-unknown})"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/dev/null
            fi
          done
