name: HRMS Backend Deploy UAT

on:
  workflow_run:
    workflows:
      - HRMS Backend CI
    types:
      - completed
    branches:
      - uat

  workflow_dispatch:
    inputs:
      run_id:
        description: Successful HRMS Backend CI run ID from uat
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hrms-backend-uat-deploy
  cancel-in-progress: false

jobs:
  deploy-uat:
    name: Deploy HRMS Backend UAT

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}

    runs-on:
      - self-hosted
      - linux
      - x64
      - hrms-backend

    timeout-minutes: 30

    steps:

      # ============================================================
      # RESOLVE EXACT CI RUN
      # ============================================================

      - name: Resolve CI run
        id: ci
        uses: actions/github-script@v8
        env:
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            let runId;

            if (context.eventName === 'workflow_run') {
              runId = Number(context.payload.workflow_run.id);
            } else {
              runId = Number(process.env.MANUAL_RUN_ID);
            }

            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed(`Invalid CI run ID: ${runId}`);
              return;
            }

            const { data: run } =
              await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });

            core.info(`CI run ID: ${run.id}`);
            core.info(`Workflow: ${run.name}`);
            core.info(`Branch: ${run.head_branch}`);
            core.info(`SHA: ${run.head_sha}`);
            core.info(`Conclusion: ${run.conclusion}`);
            core.info(`Event: ${run.event}`);

            if (run.name !== 'HRMS Backend CI') {
              core.setFailed(
                `Run ${run.id} is not HRMS Backend CI.`,
              );
              return;
            }

            if (run.conclusion !== 'success') {
              core.setFailed(
                `CI run ${run.id} did not succeed.`,
              );
              return;
            }

            if (run.head_branch !== 'uat') {
              core.setFailed(
                `Refusing to deploy branch: ${run.head_branch}`,
              );
              return;
            }

            if (!['push', 'workflow_dispatch'].includes(run.event)) {
              core.setFailed(
                `Unsupported CI event: ${run.event}`,
              );
              return;
            }

            const expectedRepository =
              `${context.repo.owner}/${context.repo.repo}`;

            const headRepository =
              run.head_repository?.full_name;

            if (
              headRepository &&
              headRepository !== expectedRepository
            ) {
              core.setFailed(
                `Refusing artifact from repository: ${headRepository}`,
              );
              return;
            }

            const sha = run.head_sha;

            if (!/^[0-9a-f]{40}$/i.test(sha)) {
              core.setFailed(
                `Invalid Git SHA: ${sha}`,
              );
              return;
            }

            core.setOutput(
              'run_id',
              String(run.id),
            );

            core.setOutput(
              'sha',
              sha,
            );

            core.setOutput(
              'artifact_name',
              `hrms-backend-release-${sha}`,
            );


      # ============================================================
      # SERVER PREFLIGHT
      # ============================================================

      - name: Validate UAT server
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE_DIR="/opt/apps/hrms-v1/uat/backend"
          SHARED_DIR="$BASE_DIR/shared"

          echo "Runner user: $(whoami)"

          if [[ "$(whoami)" != "alliance" ]]; then
            echo "ERROR: Runner must execute as alliance."
            exit 1
          fi

          required_commands=(
            node
            npm
            pm2
            curl
            tar
            sha256sum
            flock
          )

          for command in "${required_commands[@]}"; do

            if ! command -v "$command" >/dev/null 2>&1; then
              echo "Missing required command: $command"
              exit 1
            fi

          done

          test -d "$BASE_DIR"
          test -d "$BASE_DIR/releases"
          test -d "$SHARED_DIR"
          test -f "$SHARED_DIR/.env"

          if [[ ! -w "$BASE_DIR/releases" ]]; then
            echo "Runner cannot write to:"
            echo "$BASE_DIR/releases"
            exit 1
          fi

          if [[ ! -w "$SHARED_DIR" ]]; then
            echo "Runner cannot write to:"
            echo "$SHARED_DIR"
            exit 1
          fi

          chmod 600 "$SHARED_DIR/.env"

          grep -qx \
            'APP_ENV=uat' \
            "$SHARED_DIR/.env" || {
              echo "APP_ENV must be uat."
              exit 1
            }

          grep -qx \
            'APP_PORT=9999' \
            "$SHARED_DIR/.env" || {
              echo "APP_PORT must be 9999."
              exit 1
            }

          grep -qx \
            'DB_NAME=hrms_uat_db' \
            "$SHARED_DIR/.env" || {
              echo "DB_NAME must be hrms_uat_db."
              exit 1
            }

          grep -qx \
            'DB_USERNAME=hrms_uat_user' \
            "$SHARED_DIR/.env" || {
              echo "DB_USERNAME must be hrms_uat_user."
              exit 1
            }

          echo
          echo "Node:"
          node --version

          echo
          echo "npm:"
          npm --version

          echo
          echo "PM2:"
          pm2 --version

          echo
          echo "UAT server preflight passed."


      # ============================================================
      # DOWNLOAD EXACT B5 ARTIFACT
      # ============================================================

      - name: Download CI artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.ci.outputs.artifact_name }}

          path: ${{ runner.temp }}/hrms-backend-artifact

          github-token: ${{ secrets.GITHUB_TOKEN }}

          repository: ${{ github.repository }}

          run-id: ${{ steps.ci.outputs.run_id }}


      # ============================================================
      # VERIFY ARTIFACT
      # ============================================================

      - name: Verify CI artifact
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.ci.outputs.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/hrms-backend-artifact

        run: |
          set -Eeuo pipefail

          cd "$ARTIFACT_DIR"

          test -f \
            hrms-backend-release.tar.gz

          test -f \
            hrms-backend-release.tar.gz.sha256

          echo "Verifying SHA256 checksum."

          sha256sum \
            --check \
            hrms-backend-release.tar.gz.sha256

          echo "Checking archive paths."

          if tar -tzf \
            hrms-backend-release.tar.gz \
            | grep -E '(^/|(^|/)\.\.(/|$))'; then

            echo "Unsafe path detected in release archive."

            exit 1
          fi

          INSPECT_DIR="$RUNNER_TEMP/hrms-backend-inspect"

          rm -rf "$INSPECT_DIR"

          mkdir -p "$INSPECT_DIR"

          tar \
            -xzf \
            hrms-backend-release.tar.gz \
            -C "$INSPECT_DIR"

          required_files=(
            REVISION
            BUILT_AT
            package.json
            package-lock.json
            dist/main.js
            dist/database/data-source.js
            dist/database/typeorm-options.js
            deploy/hrms-backend/deploy.sh
            deploy/hrms-backend/ecosystem.config.js
          )

          for file in "${required_files[@]}"; do

            if [[ ! -f "$INSPECT_DIR/$file" ]]; then
              echo "Artifact file missing: $file"
              exit 1
            fi

          done

          if [[ ! -d "$INSPECT_DIR/dist/database/migrations" ]]; then
            echo "Compiled migration directory missing."
            exit 1
          fi

          ACTUAL_SHA="$(
            tr -d '[:space:]' \
              < "$INSPECT_DIR/REVISION"
          )"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then

            echo "REVISION mismatch."

            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"

            exit 1
          fi

          echo
          echo "Artifact verification passed."
          echo "Release: $ACTUAL_SHA"