name: Deploy HRMS Production

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Optional commit SHA from the main branch. Leave blank to deploy the latest main commit.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hrms-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy HRMS Production

    # The workflow must be started from the main branch.
    if: ${{ github.ref == 'refs/heads/main' }}

    environment: production
    timeout-minutes: 30

    runs-on:
      - self-hosted
      - hrms-prod

    steps:
      - name: Resolve deployment reference
        id: deployment
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -n "${{ inputs.deploy_sha }}" ]]; then
            DEPLOY_REF="${{ inputs.deploy_sha }}"
          else
            DEPLOY_REF="main"
          fi

          echo "ref=$DEPLOY_REF" >> "$GITHUB_OUTPUT"
          echo "Selected deployment reference: $DEPLOY_REF"

      - name: Checkout exact deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployment.outputs.ref }}
          fetch-depth: 0
          clean: true

      - name: Validate production deployment commit
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch origin main --no-tags
          DEPLOY_SHA="$(git rev-parse HEAD)"

          if ! git merge-base --is-ancestor "$DEPLOY_SHA" "origin/main"; then
            echo "Refusing deployment: $DEPLOY_SHA is not part of the main branch."
            exit 1
          fi

          echo "DEPLOY_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "Validated production deployment SHA: $DEPLOY_SHA"

      - name: Show runner information
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Runner user: $(whoami)"
          echo "Runner host: $(hostname)"
          echo "Current path: $(pwd)"
          echo "Deploy SHA: $DEPLOY_SHA"

      - name: Deploy HRMS Production
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f scripts/deploy-production.sh
          chmod +x scripts/deploy-production.sh
          bash scripts/deploy-production.sh "$DEPLOY_SHA"