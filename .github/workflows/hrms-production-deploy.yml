name: Deploy HRMS Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrms-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy HRMS Production
    runs-on:
      - self-hosted
      - hrms-prod

    steps:
      - name: Show runner info
        run: |
          echo "Runner user: $(whoami)"
          echo "Runner host: $(hostname)"
          echo "Current path: $(pwd)"

      - name: Deploy HRMS production locally
        run: |
          cd /opt/apps/hrms/prod/backend
          git fetch origin main
          git reset --hard origin/main
          chmod +x scripts/deploy-production.sh
          bash scripts/deploy-production.sh
