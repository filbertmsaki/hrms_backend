name: HRMS Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrms-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Build and Test HRMS Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      NODE_ENV: test
      PORT: 3000

      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: hrms_test

      JWT_ACCESS_SECRET: test_access_secret
      JWT_REFRESH_SECRET: test_refresh_secret
      JWT_RESET_SECRET: test_reset_secret
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      JWT_ISSUER: hrms
      JWT_AUDIENCE: hrms-client

      APP_URL: http://localhost:3000
      APP_FRONTEND_URL: http://localhost:3001
      APP_NAME: HRMS
      SUPPORT_EMAIL: support@example.com

      MAIL_HOST: localhost
      MAIL_PORT: 1025
      MAIL_USER: test@example.com
      MAIL_PASS: test_password
      MAIL_FROM: test@example.com
      MAIL_SECURE: false

      USE_REDIS: false
      REDIS_URL: redis://127.0.0.1:6379

      THROTTLER_TTL: 60000
      THROTTLER_LIMIT: 100

      ENABLE_EMAIL_VERIFICATION: false
      EMAIL_VERIFICATION_EXPIRY_HOURS: 24

      HIKVISION_EVENTS_LOG_FILE: logs/hikvision-events.log
      HIKVISION_EVENTS_RECONNECT_DELAY_MS: 5000
      HIKVISION_EVENTS_AUTOSTART: false
      HIKVISION_EVENTS_LOG_STEPS: false
      HIKVISION_AUTO_SYNC_START_TIME: "00:00"
      HIKVISION_AUTO_SYNC_END_TIME: "23:59"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run lint:check

      - name: Run unit tests
        run: npm test -- --ci --runInBand

      - name: Build backend
        run: npm run build
