name: HRMS Backend CI/CD

on:
  push:
    branches:
      - uat
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'deploy/hrms-backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'eslint.config.mjs'
      - '.gitattributes'
      - '.github/workflows/hrms-backend-ci.yml'
      - '.github/workflows/hrms-backend-deployment-preflight.yml'

  pull_request:
    branches:
      - uat
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy after a successful manual build
        required: true
        type: choice
        options:
          - uat
          - production

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint, typecheck and unit tests

    runs-on: ubuntu-latest

    concurrency:
      group: hrms-backend-static-${{ github.ref }}
      cancel-in-progress: true

    timeout-minutes: 20

    env:
      CI: true
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci \
            --no-audit \
            --no-fund

      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs', 'tsconfig.json') }}-

      - name: Lint
        run: npm run lint:check -- --cache --cache-location .eslintcache --cache-strategy content

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: |
          npm test -- \
            --maxWorkers=2 \
            --passWithNoTests

  validate-and-package:
    name: Validate and package HRMS backend

    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    concurrency:
      group: hrms-backend-ci-${{ github.ref }}
      cancel-in-progress: true

    timeout-minutes: 30

    env:
      CI: true
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: hrms_test_db
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-outside-automated-tests
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-outside-automated-tests
      JWT_RESET_SECRET: ci-only-reset-secret-not-used-outside-automated-tests
      PLATFORM_ADMIN_PASSWORD: CI-Test-Owner-Password-2026!
      COMPANY_ADMIN_PASSWORD: CI-Test-Admin-Password-2026!
      EMPLOYEE_IMPORT_DEFAULT_PASSWORD: CI-Test-Employee-Password-2026!
      USE_REDIS: false
      MAIL_HOST: ci-only-mail-host.invalid
      MAIL_PORT: 587
      MAIL_USER: ci-only-mail-user@example.invalid
      MAIL_PASS: ci-only-mail-password-not-used-outside-automated-tests
      MAIL_FROM: ci-only-mail-user@example.invalid

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hrms_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            package.json
            package-lock.json
            nest-cli.json
            tsconfig.json
            tsconfig.build.json
            deploy/hrms-backend/deploy.sh
            deploy/hrms-backend/stage-release.sh
            deploy/hrms-backend/rollback.sh
            deploy/hrms-backend/server-setup.sh
            deploy/hrms-backend/ecosystem.config.js
          )

          for file in "${required_files[@]}"; do

            test -f "$file" || {
              echo "Required file missing: $file"
              exit 1
            }

          done

      - name: Validate Linux line endings
        shell: bash
        run: |
          set -Eeuo pipefail

          for file in \
            deploy/hrms-backend/deploy.sh \
            deploy/hrms-backend/stage-release.sh \
            deploy/hrms-backend/rollback.sh \
            deploy/hrms-backend/server-setup.sh; do

            if grep -q $'\r' "$file"; then
              echo "$file contains Windows CRLF line endings."
              exit 1
            fi
          done

          echo "Deployment scripts use LF line endings."

      - name: Validate deployment script
        shell: bash
        run: |
          set -Eeuo pipefail

          bash -n deploy/hrms-backend/deploy.sh
          bash -n deploy/hrms-backend/stage-release.sh
          bash -n deploy/hrms-backend/rollback.sh
          bash -n deploy/hrms-backend/server-setup.sh

      - name: Validate deploy executable mode
        shell: bash
        run: |
          set -Eeuo pipefail

          MODE="$(git ls-files --stage deploy/hrms-backend/deploy.sh | awk '{print $1}')"

          echo "deploy.sh mode: $MODE"

          [[ "$MODE" == "100755" ]] || {
            echo "deploy.sh must be committed as executable."
            exit 1
          }

      - name: Validate PM2 configuration
        run: |
          node --check \
            deploy/hrms-backend/ecosystem.config.js

      - name: Install dependencies
        run: |
          npm ci \
            --no-audit \
            --no-fund

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in {1..30}; do
            if pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_NAME"; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            sleep 2
          done

          echo "PostgreSQL did not become ready in time."
          exit 1

      - name: Validate package scripts
        shell: bash
        run: |
          node <<'NODE'

          const pkg = require('./package.json');

          const scripts = [
            'build',
            'lint:check',
            'typecheck',
            'test',
            'db:backup:built',
            'migration:run:built',
            'migration:show:built',
            'migration:revert:built',
            'seed:run:built',
          ];

          for (const script of scripts) {

            if (!pkg.scripts?.[script]) {

              console.error(
                `Missing required script: ${script}`
              );

              process.exit(1);
            }

            console.log(`[OK] ${script}`);
          }


          if (!pkg.dependencies?.typeorm) {

            console.error(
              'typeorm must be in production dependencies.'
            );

            process.exit(1);
          }

          console.log(
            '[OK] typeorm production dependency'
          );

          NODE

      - name: Build backend
        run: npm run build

      - name: Run test database migrations
        run: npm run migration:run:built

      - name: Seed test database
        run: npm run seed:run:built

      - name: E2E tests
        run: npm run test:e2e

      - name: Validate compiled backend
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            dist/main.js
            dist/database/data-source.js
            dist/database/typeorm-options.js
            dist/scripts/drop-import-migrate-seed.js
            src/database/seeds/dump/hrms_db_2026-09-28.dump
          )

          for file in "${required_files[@]}"; do

            test -f "$file" || {
              echo "Missing compiled file: $file"
              exit 1
            }

          done


          test -d dist/database/migrations || {
            echo "Compiled migrations directory missing."
            exit 1
          }

          test -f deploy/hrms-backend/register-src-alias.cjs || {
            echo "Production source alias resolver is missing."
            exit 1
          }


          MIGRATION_COUNT="$(
            find dist/database/migrations \
              -maxdepth 1 \
              -type f \
              -name '*.js' \
              | wc -l
          )"


          echo "Compiled migrations: $MIGRATION_COUNT"


          [[ "$MIGRATION_COUNT" -gt 0 ]] || {
            echo "No compiled migrations found."
            exit 1
          }

      - name: Validate compiled TypeORM paths
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -q \
            "src/database/migrations" \
            dist/database/typeorm-options.js; then

            echo "Compiled datasource still references src."

            exit 1
          fi

          echo "Compiled datasource is release-safe."

      - name: Build release artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE_DIR="$RUNNER_TEMP/hrms-backend-release"

          ARCHIVE="$RUNNER_TEMP/hrms-backend-release.tar.gz"

          CHECKSUM="$RUNNER_TEMP/hrms-backend-release.tar.gz.sha256"


          rm -rf "$RELEASE_DIR"

          rm -f \
            "$ARCHIVE" \
            "$CHECKSUM"


          mkdir -p \
            "$RELEASE_DIR/deploy/hrms-backend"


          cp -a \
            dist \
            "$RELEASE_DIR/dist"


          mkdir -p \
            "$RELEASE_DIR/src/database/seeds/dump"


          cp \
            src/database/seeds/dump/hrms_db_2026-09-28.dump \
            "$RELEASE_DIR/src/database/seeds/dump/hrms_db_2026-09-28.dump"


          cp \
            package.json \
            package-lock.json \
            "$RELEASE_DIR/"


          cp \
            deploy/hrms-backend/deploy.sh \
            "$RELEASE_DIR/deploy/hrms-backend/deploy.sh"


          cp \
            deploy/hrms-backend/stage-release.sh \
            "$RELEASE_DIR/deploy/hrms-backend/stage-release.sh"


          cp \
            deploy/hrms-backend/ecosystem.config.js \
            "$RELEASE_DIR/deploy/hrms-backend/ecosystem.config.js"


          cp \
            deploy/hrms-backend/register-src-alias.cjs \
            "$RELEASE_DIR/deploy/hrms-backend/register-src-alias.cjs"


          chmod 750 \
            "$RELEASE_DIR/deploy/hrms-backend/deploy.sh" \
            "$RELEASE_DIR/deploy/hrms-backend/stage-release.sh"


          printf '%s\n' \
            "$GITHUB_SHA" \
            > "$RELEASE_DIR/REVISION"


          printf '%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > "$RELEASE_DIR/BUILT_AT"


          tar \
            -C "$RELEASE_DIR" \
            -czf "$ARCHIVE" \
            .


          (
            cd "$RUNNER_TEMP"

            sha256sum \
              hrms-backend-release.tar.gz \
              > hrms-backend-release.tar.gz.sha256


            sha256sum \
              --check \
              hrms-backend-release.tar.gz.sha256
          )


          echo "Release artifact created."

          ls -lh \
            "$ARCHIVE" \
            "$CHECKSUM"

      - name: Upload backend artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hrms-backend-release-${{ github.sha }}

          path: |
            ${{ runner.temp }}/hrms-backend-release.tar.gz
            ${{ runner.temp }}/hrms-backend-release.tar.gz.sha256

          if-no-files-found: error

          retention-days: 14

          compression-level: 0

      - name: Prune old release artifacts
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          keep=10
          repo="${{ github.repository }}"
          mapfile -t ids < <(
            gh api "repos/${repo}/actions/artifacts" --paginate -q \
              '.artifacts[] | select(.name | startswith("hrms-backend-release-")) | [.created_at, .id] | @tsv' \
              | sort -r | tail -n +$((keep + 1)) | cut -f2
          )
          if [[ ${#ids[@]} -eq 0 ]]; then
            echo "Nothing to prune, ${keep} or fewer artifacts exist."
            exit 0
          fi
          echo "Deleting ${#ids[@]} artifact(s) beyond the newest ${keep}."
          for id in "${ids[@]}"; do
            gh api -X DELETE "repos/${repo}/actions/artifacts/${id}" && echo "Deleted artifact $id" || echo "Failed to delete artifact $id" >&2
          done

  deploy:
    name: Deploy HRMS backend

    needs:
      - static-checks
      - validate-and-package

    if: >-
      needs.static-checks.result == 'success' &&
      needs.validate-and-package.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/uat') ||
        (github.event_name == 'workflow_dispatch' &&
         ((github.ref == 'refs/heads/uat' && inputs.environment == 'uat') ||
          (github.ref == 'refs/heads/main' && inputs.environment == 'production')))
      )

    runs-on:
      - self-hosted
      - Linux
      - X64
      - hrms
      - backend
      - deployment

    timeout-minutes: 30

    environment:
      name: ${{ github.ref_name == 'uat' && 'hrms-backend-uat' || 'hrms-backend-production' }}

    concurrency:
      group: hrms-backend-${{ github.ref_name }}-deploy
      cancel-in-progress: false

    env:
      TARGET_ENV: ${{ github.event_name == 'push' && 'uat' || inputs.environment }}
      BASE_DIR: ${{ vars.BASE_DIR }}
      PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
      APP_ENV: ${{ vars.APP_ENV }}
      APP_HOST: ${{ vars.APP_HOST }}
      APP_PORT: ${{ vars.APP_PORT }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH || '/api/health/ready' }}
      KEEP_RELEASES: ${{ vars.KEEP_RELEASES || '3' }}
      BACKUP_BEFORE_MIGRATION: ${{ vars.BACKUP_BEFORE_MIGRATION || 'false' }}

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: hrms-backend-release-${{ github.sha }}
          path: ${{ runner.temp }}/hrms-backend-artifact

      - name: Validate deployment configuration and artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          for value in \
            BASE_DIR \
            PM2_APP_NAME \
            APP_ENV \
            APP_HOST \
            APP_PORT \
            HEALTH_PATH; do
            [[ -n "${!value}" ]] || { echo "Missing $value."; exit 1; }
          done

          [[ "$APP_PORT" =~ ^[0-9]+$ ]]
          [[ "$KEEP_RELEASES" =~ ^[0-9]+$ ]]
          [[ "$BACKUP_BEFORE_MIGRATION" =~ ^(true|false)$ ]]

          case "$TARGET_ENV" in
            uat)
              [[ "$APP_ENV" == 'uat' ]]
              ;;
            production)
              [[ "$APP_ENV" == 'production' ]]
              ;;
            *)
              echo "Unsupported target environment: $TARGET_ENV" >&2
              exit 1
              ;;
          esac

          echo "HEALTH_URL=http://127.0.0.1:${APP_PORT}${HEALTH_PATH}" >> "$GITHUB_ENV"

          cd "$RUNNER_TEMP/hrms-backend-artifact"
          sha256sum --check hrms-backend-release.tar.gz.sha256

      - name: Deploy release locally
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE_ID="$GITHUB_SHA"
          ARCHIVE="$RUNNER_TEMP/hrms-backend-artifact/hrms-backend-release.tar.gz"
          STAGE_SCRIPT="$RUNNER_TEMP/stage-hrms-backend-$RELEASE_ID.sh"

          [[ "$(id -u)" -ne 0 ]]
          [[ -w "$BASE_DIR/releases" ]]
          [[ -w "$BASE_DIR/shared" ]]
          [[ -w "$BASE_DIR/tmp" ]]

          install -m 0750 deploy/hrms-backend/stage-release.sh "$STAGE_SCRIPT"
          bash "$STAGE_SCRIPT" "$RELEASE_ID" "$ARCHIVE"

      - name: Verify deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error "$HEALTH_URL" >/dev/null
          pm2 status "$PM2_APP_NAME"
          [[ "$(readlink -f "$BASE_DIR/current")" == "$BASE_DIR/releases/$GITHUB_SHA" ]]
