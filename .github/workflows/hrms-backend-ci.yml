name: HRMS Backend CI

on:
  push:
    branches:
      - uat
      - main
    paths:
      - 'src/**'
      - 'test/**'
      - 'deploy/hrms-backend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.husky/**'
      - 'nest-cli.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'eslint.config.mjs'
      - '.gitattributes'
      - '.github/workflows/hrms-backend-ci.yml'
      - '.github/workflows/hrms-backend-deploy-uat.yml'
      - '.github/workflows/hrms-backend-deploy-production.yml'

  pull_request:
    branches:
      - uat
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrms-backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate-and-package:

    name: Validate and package HRMS backend

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      CI: true
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: hrms_test_db

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hrms_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm


      - name: Validate required files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            package.json
            package-lock.json
            nest-cli.json
            tsconfig.json
            tsconfig.build.json
            deploy/hrms-backend/deploy.sh
            deploy/hrms-backend/ecosystem.config.js
          )

          for file in "${required_files[@]}"; do

            test -f "$file" || {
              echo "Required file missing: $file"
              exit 1
            }

          done


      - name: Validate Linux line endings
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -q $'\r' deploy/hrms-backend/deploy.sh; then

            echo "deploy.sh contains Windows CRLF line endings."

            exit 1
          fi

          echo "deploy.sh uses LF line endings."


      - name: Validate deployment script
        shell: bash
        run: |
          set -Eeuo pipefail

          bash -n deploy/hrms-backend/deploy.sh


      - name: Validate deploy executable mode
        shell: bash
        run: |
          set -Eeuo pipefail

          MODE="$(
            git ls-files \
              --stage \
              deploy/hrms-backend/deploy.sh \
              | awk '{print $1}'
          )"

          echo "deploy.sh mode: $MODE"

          [[ "$MODE" == "100755" ]] || {
            echo "deploy.sh must be committed as executable."
            exit 1
          }


      - name: Validate PM2 configuration
        run: |
          node --check \
            deploy/hrms-backend/ecosystem.config.js


      - name: Install dependencies
        run: |
          npm ci \
            --no-audit \
            --no-fund


      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in {1..30}; do
            if pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -d "$DB_NAME"; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            sleep 2
          done

          echo "PostgreSQL did not become ready in time."
          exit 1


      - name: Validate package scripts
        shell: bash
        run: |
          node <<'NODE'

          const pkg = require('./package.json');

          const scripts = [
            'build',
            'lint:check',
            'test',
            'migration:run:built',
            'migration:show:built',
            'migration:revert:built',
          ];

          for (const script of scripts) {

            if (!pkg.scripts?.[script]) {

              console.error(
                `Missing required script: ${script}`
              );

              process.exit(1);
            }

            console.log(`[OK] ${script}`);
          }


          if (!pkg.dependencies?.typeorm) {

            console.error(
              'typeorm must be in production dependencies.'
            );

            process.exit(1);
          }

          console.log(
            '[OK] typeorm production dependency'
          );

          NODE


      - name: Lint
        run: npm run lint:check


      - name: Unit tests
        run: |
          npm test -- \
            --runInBand \
            --passWithNoTests


      - name: Build backend
        run: npm run build


      - name: E2E tests
        run: npm run test:e2e


      - name: Validate compiled backend
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=(
            dist/main.js
            dist/database/data-source.js
            dist/database/typeorm-options.js
          )

          for file in "${required_files[@]}"; do

            test -f "$file" || {
              echo "Missing compiled file: $file"
              exit 1
            }

          done


          test -d dist/database/migrations || {
            echo "Compiled migrations directory missing."
            exit 1
          }


          MIGRATION_COUNT="$(
            find dist/database/migrations \
              -maxdepth 1 \
              -type f \
              -name '*.js' \
              | wc -l
          )"


          echo "Compiled migrations: $MIGRATION_COUNT"


          [[ "$MIGRATION_COUNT" -gt 0 ]] || {
            echo "No compiled migrations found."
            exit 1
          }


      - name: Validate compiled TypeORM paths
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -q \
            "src/database/migrations" \
            dist/database/typeorm-options.js; then

            echo "Compiled datasource still references src."

            exit 1
          fi

          echo "Compiled datasource is release-safe."


      - name: Build release artifact
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE_DIR="$RUNNER_TEMP/hrms-backend-release"

          ARCHIVE="$RUNNER_TEMP/hrms-backend-release.tar.gz"

          CHECKSUM="$RUNNER_TEMP/hrms-backend-release.tar.gz.sha256"


          rm -rf "$RELEASE_DIR"

          rm -f \
            "$ARCHIVE" \
            "$CHECKSUM"


          mkdir -p \
            "$RELEASE_DIR/deploy/hrms-backend"


          cp -a \
            dist \
            "$RELEASE_DIR/dist"


          cp \
            package.json \
            package-lock.json \
            "$RELEASE_DIR/"


          cp \
            deploy/hrms-backend/deploy.sh \
            "$RELEASE_DIR/deploy/hrms-backend/deploy.sh"


          cp \
            deploy/hrms-backend/ecosystem.config.js \
            "$RELEASE_DIR/deploy/hrms-backend/ecosystem.config.js"


          chmod 750 \
            "$RELEASE_DIR/deploy/hrms-backend/deploy.sh"


          printf '%s\n' \
            "$GITHUB_SHA" \
            > "$RELEASE_DIR/REVISION"


          printf '%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > "$RELEASE_DIR/BUILT_AT"


          tar \
            -C "$RELEASE_DIR" \
            -czf "$ARCHIVE" \
            .


          (
            cd "$RUNNER_TEMP"

            sha256sum \
              hrms-backend-release.tar.gz \
              > hrms-backend-release.tar.gz.sha256


            sha256sum \
              --check \
              hrms-backend-release.tar.gz.sha256
          )


          echo "Release artifact created."

          ls -lh \
            "$ARCHIVE" \
            "$CHECKSUM"


      - name: Upload backend artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:

          name: hrms-backend-release-${{ github.sha }}

          path: |
            ${{ runner.temp }}/hrms-backend-release.tar.gz
            ${{ runner.temp }}/hrms-backend-release.tar.gz.sha256

          if-no-files-found: error

          retention-days: 14

          compression-level: 0
